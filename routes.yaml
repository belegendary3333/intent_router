chat:
  # 情绪陪伴 / 日常交流
  - 我今天好难受
  - 我心情不太好
  - 我最近有点焦虑
  - 陪我聊聊天
  - 你能陪我说说话吗
  - 给我讲个故事
  - 给我讲个笑话
  - 你叫什么名字
  - 介绍一下你自己
  - 我今天很开心
  - 你觉得这件事怎么样
  - 你怎么看这个问题
  - 我有点累
  # 问候 / 天气 / 知识问答
  - 你好呀
  - 早上好
  - 你在干什么
  - 深圳今天天气怎么样
  - 今天会下雨吗
  - 为什么天空是蓝色的
  - 明天是星期几
  - 谢谢你
  # 提到唱歌或跳舞，但只是陈述 / 讨论，不要求机器人执行
  - 我梦见自己在唱歌
  - 你觉得跳舞有什么好处
  - 唱歌为什么能让人开心
