singing:
  # 开始唱歌 / 指定歌曲
  - 给我唱首歌
  - 请给我唱首歌
  - 我想听你唱歌
  - 我想听一首歌
  - 唱一首七里香
  - 唱一首晴天给我听
  - 给我唱平凡之路
  - 来一首中国人能飞
  # 查询唱歌能力 / 曲库
  - 你会唱什么歌
  - 你会唱中国人能飞吗
  # 换歌 / 重唱
  - 换一首歌
  - 换成富士山下
  - 再唱一首别的歌
  - 换首歌唱吧
  - 从头再唱一遍
  # 暂停 / 停止 / 恢复
  - 暂停唱歌
  - 不要唱了
  - 先别唱了
  - 把歌停一下
  - 继续唱歌
  - 接着唱刚才那首歌

