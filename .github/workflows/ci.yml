name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install protocol-test dependencies
        run: >-
          python -m pip install
          'fastapi>=0.115,<1' 'httpx>=0.27,<1'
          'numpy>=1.26,<3' 'PyYAML>=6,<7'
      - name: Test routing and HTTP contracts without model downloads
        run: python -m unittest discover -s tests -p 'test_app.py' -v
      - name: Check frontend and shell syntax
        run: |
          node --check lab_web/app.js
          node --check tests/test_lab_ui.cjs
          bash -n setup.sh run.sh setup_lab.sh setup_large_lab.sh run_lab.sh run_container.sh
