[program:intent_router]
command=/bin/bash %(ENV_HOME)s/intent_router/run_container.sh
directory=%(ENV_HOME)s/intent_router
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.local/state/coder-services/intent_router.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
